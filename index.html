<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Airline PNR System</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    margin:0;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.app{
    width:400px;
    background:#111827;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    color:white;
}

.header{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    padding:15px;
    text-align:center;
}

.content{padding:15px;}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-top:10px;
    background:#1f2937;
    color:white;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    margin-top:10px;
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.status-card{
    margin-top:15px;
    padding:10px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    display:none;
}

.success{background:#16a34a;}
.pending{background:#f59e0b;}
.cancel{background:#ef4444;}

.ticket{
    margin-top:15px;
    background:#1f2937;
    border-radius:12px;
    display:none;
}

.route{text-align:center;padding:10px;}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    padding:10px;
    font-size:13px;
}

.box{
    background:#111827;
    padding:8px;
    border-radius:8px;
}

.label{
    font-size:11px;
    opacity:0.6;
}

.passenger-list{
    padding:10px;
}

.passenger{
    background:#111827;
    padding:8px;
    border-radius:8px;
    margin-bottom:5px;
    font-size:13px;
}

.note{
    background:#0b1220;
    padding:10px;
    font-size:11px;
    border-top:1px solid #374151;
}

#notif{
    position:fixed;
    top:15px;
    right:15px;
    padding:10px 15px;
    border-radius:8px;
    color:white;
    display:none;
}

.ok{background:#22c55e;}
.err{background:#ef4444;}
</style>
</head>

<body>

<div class="app">
    <div class="header">
        <h2>✈️ Airline PNR System</h2>
        <p>Check booking & flight details</p>
    </div>

    <div class="content">
        <input type="text" id="pnr" placeholder="Enter PNR Code">
        <button onclick="cekPNR()">Search Ticket</button>

        <div class="status-card" id="statusCard"></div>

        <div class="ticket" id="ticket">

            <div class="route">
                <h3 id="rute"></h3>
                <small id="jam"></small>
            </div>

            <div class="grid">
                <div class="box">
                    <div class="label">Airline</div>
                    <div id="maskapai"></div>
                </div>

                <div class="box">
                    <div class="label">Gate</div>
                    <div id="gate"></div>
                </div>

                <div class="box">
                    <div class="label">Class</div>
                    <div id="kelas"></div>
                </div>

                <div class="box">
                    <div class="label">Baggage</div>
                    <div id="bagasi"></div>
                </div>

                <div class="box">
                    <div class="label">E-Ticket</div>
                    <div id="eticket"></div>
                </div>

                <div class="box">
                    <div class="label">PNR</div>
                    <div id="kode"></div>
                </div>
            </div>

            <div class="passenger-list" id="passengers"></div>

            <div class="note">
                Please arrive at the airport 90 minutes before departure.
            </div>
        </div>
    </div>
</div>

<div id="notif"></div>

<script>
const dataPNR={
    "SJTUW3":{
        maskapai:"LION AIR",
        nama:[
            "Iksan",
            "Fatimah rasyid",
            "Fitriani",
            "Muh Ali jodding.S pdi"
        ],
        rute:"MAKASSAR (UPG) → BALI (DPS)",
        jam:"14:25",
        gate:"Gate 3",
        kelas:"Economy",
        bagasi:"20 KG",
        eticket:"698-3945274215",
        status:PANDING PAYMENT"
    },
    "XYZ789":{
        maskapai:"LION AIR",
        nama:[
            "Rani",
            "Dimas Saputra",
            "Andi Pratama",
            "Nurul Hasanah"
        ],
        rute:"SURABAYA → MAKASSAR",
        jam:"15:30 WIB",
        gate:"B7",
        kelas:"Business",
        bagasi:"30 KG",
        eticket:"ETK-112233",
        status:"BOARDING"
    }
};

function notif(text,type){
    let n=document.getElementById("notif");
    n.innerText=text;
    n.className=type==="ok"?"ok":"err";
    n.style.display="block";
    setTimeout(()=>n.style.display="none",2000);
}

function cekPNR(){
    let pnr=document.getElementById("pnr").value.trim().toUpperCase();
    let ticket=document.getElementById("ticket");
    let statusCard=document.getElementById("statusCard");

    if(!pnr){
        notif("Masukkan kode PNR","err");
        return;
    }

    if(dataPNR[pnr]){
        let d=dataPNR[pnr];

        document.getElementById("rute").innerText=d.rute;
        document.getElementById("jam").innerText=d.jam;
        document.getElementById("maskapai").innerText=d.maskapai;
        document.getElementById("gate").innerText=d.gate;
        document.getElementById("kelas").innerText=d.kelas;
        document.getElementById("bagasi").innerText=d.bagasi;
        document.getElementById("eticket").innerText=d.eticket;
        document.getElementById("kode").innerText=pnr;

        // tampilkan penumpang per baris
        let list="";
        d.nama.forEach((n,i)=>{
            list += `<div class="passenger">${i+1}. ${n}</div>`;
        });
        document.getElementById("passengers").innerHTML=list;

        ticket.style.display="block";

        statusCard.style.display="block";
        statusCard.innerText=d.status;

        if(d.status==="CONFIRMED"){
            statusCard.className="status-card success";
        }else if(d.status==="CANCEL"){
            statusCard.className="status-card cancel";
        }else{
            statusCard.className="status-card pending";
        }

        notif("PNR Found","ok");

    }else{
        ticket.style.display="none";
        statusCard.style.display="none";
        notif("PNR Not Found","err");
    }
}
</script>

</body>
</html>
